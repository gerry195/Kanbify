<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <style>
      .trail1 { animation: slideIn 0.4s cubic-bezier(0.22,1,0.36,1) 0.08s both; }
      .trail2 { animation: slideIn 0.38s cubic-bezier(0.22,1,0.36,1) 0.16s both; }
      .trail3 { animation: slideIn 0.36s cubic-bezier(0.22,1,0.36,1) 0.24s both; }
      .card   { animation: slideIn 0.34s cubic-bezier(0.22,1,0.36,1) 0.34s both; }
      .line1  { animation: scaleIn 0.26s cubic-bezier(0.22,1,0.36,1) 0.46s both; transform-origin: 16px 13px; }
      .line2  { animation: scaleIn 0.24s cubic-bezier(0.22,1,0.36,1) 0.51s both; transform-origin: 16px 21px; }
      .line3  { animation: scaleIn 0.22s cubic-bezier(0.22,1,0.36,1) 0.56s both; transform-origin: 16px 29px; }
      .arrow  { animation: arrowIn 0.3s cubic-bezier(0.22,1,0.36,1) 0.62s both; }
      .wmark  { animation: fadeSlide 0.35s cubic-bezier(0.22,1,0.36,1) 0.7s both; }
      .tag    { animation: fadeSlide 0.3s cubic-bezier(0.22,1,0.36,1) 0.8s both; }

      @keyframes slideIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scaleX(0); }
        to   { opacity: 1; transform: scaleX(1); }
      }
      @keyframes arrowIn {
        from { opacity: 0; transform: translate(-5px, 5px); }
        to   { opacity: 1; transform: translate(0, 0);      }
      }
      @keyframes fadeSlide {
        from { opacity: 0; transform: translateX(-8px); }
        to   { opacity: 1; transform: translateX(0);    }
      }
    </style>
  </defs>

  <!-- Trail 1 (paling belakang) -->
  <g class="trail1" opacity="0">
    <rect x="8" y="26" width="50" height="34" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" opacity="0.15" transform="rotate(-10 33 43)"/>
  </g>

  <!-- Trail 2 -->
  <g class="trail2" opacity="0">
    <rect x="8" y="20" width="50" height="34" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" opacity="0.32" transform="rotate(-5 33 37)"/>
  </g>

  <!-- Trail 3 -->
  <g class="trail3" opacity="0">
    <rect x="8" y="12" width="50" height="34" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" opacity="0.55" transform="rotate(-2 33 29)"/>
  </g>

  <!-- Card utama -->
  <g class="card">
    <rect x="8" y="4" width="50" height="34" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  </g>

  <!-- Garis di card -->
  <rect class="line1" x="16" y="13" width="26" height="3" rx="1.5" fill="#d1d5db" opacity="0.9"/>
  <rect class="line2" x="16" y="21" width="18" height="3" rx="1.5" fill="#d1d5db" opacity="0.55"/>
  <rect class="line3" x="16" y="29" width="22" height="3" rx="1.5" fill="#d1d5db" opacity="0.3"/>



  <!-- Wordmark -->
  <text class="wmark" x="82" y="38"
    font-family="system-ui, sans-serif"
    font-size="32" font-weight="600"
    fill="#ffffff" letter-spacing="-0.5"
    opacity="0">Kanbify</text>

  <!-- Tagline -->
  <text class="tag" x="84" y="52"
    font-family="system-ui, sans-serif"
    font-size="8" font-weight="500"
    fill="#f3f4f6" letter-spacing="2"
    opacity="0">MOVE. TRACK. DONE.</text>
</svg>
